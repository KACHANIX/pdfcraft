name: Sync main from upstream

on:
  schedule:
    - cron: "0 0 * * *" # Every day at 03:17 UTC
  workflow_dispatch: # Also allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main from upstream
        run: |
          git remote add upstream https://github.com/storytold/pdfcraft.git
          git fetch upstream main
          git merge --ff-only upstream/main
          git push origin main